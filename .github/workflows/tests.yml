name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:      # release.yml condiciona la publicacion a esta suite

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (analyze + test)
    # Windows: varias pruebas (actualizacion, mirada) solo corren en Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub lib test

      - name: Test
        run: flutter test --no-pub

  sidecar:
    name: Sidecar (unittest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sidecar/requirements.txt
            sidecar/constraints.txt

      - name: Install dependencies
        working-directory: sidecar
        run: pip install -r requirements.txt -c constraints.txt

      - name: Run test suite
        working-directory: sidecar
        run: python -m unittest discover -s tests -p "test_*.py" -v
