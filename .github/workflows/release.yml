name: Build & Release

# Se dispara al hacer merge a main (p. ej. un PR de develop -> main) y tambien
# manualmente. Construye la app Flutter + el sidecar (PyInstaller) + el
# instalador (Inno Setup) y publica un GitHub Release con el .exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear/actualizar releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # La suite completa corre primero; solo se publica si pasa.
  test:
    uses: ./.github/workflows/tests.yml

  # Una release publicada no se reescribe: si el tag de la version del
  # pubspec ya existe (p. ej. un merge que solo toca CI), no se compila.
  version:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Buscar el tag de la version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//' | tr -d '\r')"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "La release $v ya existe; no se vuelve a publicar." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    needs: [test, version]
    if: needs.version.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer version del pubspec
        id: ver
        shell: bash
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')" >> "$GITHUB_OUTPUT"
          echo "full=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get --enforce-lockfile

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps del sidecar + PyInstaller
        working-directory: sidecar
        run: pip install -r requirements.txt -c constraints.txt pyinstaller==6.21.0

      - name: Build sidecar (PyInstaller)
        working-directory: sidecar
        run: python -m PyInstaller gaze_service.spec --noconfirm

      - name: Build Flutter Windows (release)
        # IG_APP_VERSION activa la busqueda de actualizaciones (x.y.z+n).
        run: flutter build windows --release --dart-define=IG_APP_VERSION=${{ steps.ver.outputs.full }}

      - name: Integrar sidecar en el Release
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Remove-Item -Recurse -Force "$rel/gaze" -ErrorAction SilentlyContinue
          Copy-Item -Recurse "sidecar/dist/gaze_service" "$rel/gaze"

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          "/DMyAppVersion=${{ steps.ver.outputs.version }}"
          "installer\InteractorGate.iss"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: InteractorGate v${{ steps.ver.outputs.version }}
          files: installer/Output/InteractorGate-Setup.exe
          fail_on_unmatched_files: true
          body: |
            App de escritorio Windows de comunicacion aumentativa (AAC) por mirada + prediccion de texto.

            **Descargar** `InteractorGate-Setup.exe` (Assets) y ejecutar.
            > Al no estar firmado, Windows puede mostrar "Windows protegio tu PC": **Mas informacion -> Ejecutar de todos modos**.

            **Requisitos:** Windows 10/11 (64-bit), webcam, internet.
            **Sesiones:** iniciar sesion con el codigo de participante. Cada acceso crea una sesion nueva; al cerrar se confirma su registro y se limpia el tablero.
            **Estudio E2 (piloto):** usar "Preparar estudio E2" para practica S1 y medicion S2/S3, con bloques alternados con y sin prediccion. Las frases son provisionales y requieren revision metodologica antes del estudio real.
            **Registros E2:** cola local cifrada con reenvio sin duplicar eventos, correcciones y sugerencias registradas, y opcion "Verificar y exportar sesion" para reconstruir los ensayos.
            **Continuaciones:** en el teclado, terminar una palabra y pulsar ESPACIO para pedir palabras siguientes. Cada edicion invalida las respuestas anteriores; aceptar agrega la continuacion con un solo espacio de separacion.
            **Instrumento E1:** modo local para el investigador con CNN generica y motor calibrado, tareas separadas y registros por participante/sesion. Requiere ficha de pantalla y condiciones; ver docs/INSTRUMENTO_E1.md antes de interpretar resultados.
            **Limite del piloto E1:** se verifico el registro, pero la precision ocular fue baja. No acredita desempeno para participantes; faltan las condiciones completas del protocolo y la observacion de falsas activaciones espontaneas.
            **Analisis del estudio:** modo local de investigacion para tablas CSV, figuras e informe HTML de E1/E2 y puntuaciones SUS/QUEST. Conserva exclusiones y separa pilotos, datos sinteticos y poblacion objetivo; ver docs/ANALISIS_E1_E2.md. No hay conclusiones de eficacia sin datos elegibles ni prueba de aleatorizacion sin un espacio de asignacion valido.
            **Mirada:** calibracion (mirar los puntos) -> tablero. El cursor sigue la mirada; parpadear = clic.
